<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead Desk · Flow Wellness Chiropractic</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/img/favicon-64.png">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('fwc-leaddesk-theme'); } catch (e) {}
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="crm.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <aside class="side">
    <a class="brand" href="#/leads">
      <img src="../assets/img/logo-mark.png" alt="">
      <span>Flow<small>Lead Desk</small></span>
    </a>
    <nav class="side-nav" aria-label="Primary">
      <a href="#/leads" data-view="leads">Leads <b id="nav-leads-count"></b></a>
      <a href="#/activity" data-view="activity">Activity</a>
      <a href="#/automations" data-view="automations">Automations</a>
      <a href="#/sources" data-view="sources">Sources</a>
    </nav>
    <div class="side-foot">
      <button class="btn sm block" id="btn-new-lead" type="button">New lead</button>
      <button class="link-btn" id="btn-simulate" type="button">Simulate incoming lead</button>
      <div class="theme"><button class="theme-btn" type="button" data-theme-toggle aria-label="Toggle dark mode"><span class="label">Dark mode</span><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
      <p class="who">Signed in as <strong>Front desk</strong></p>
      <button class="link-btn muted" id="btn-reset" type="button">Reset demo data</button>
    </div>
  </aside>

  <header class="mobile-head">
    <div class="top"><a class="brand" href="#/leads"><img src="../assets/img/logo-mark.png" alt=""><span>Flow<small>Lead Desk</small></span></a><button class="theme-btn" type="button" data-theme-toggle aria-label="Toggle dark mode"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
    <nav aria-label="Primary" class="mobile-nav">
      <a href="#/leads" data-view="leads">Leads</a>
      <a href="#/activity" data-view="activity">Activity</a>
      <a href="#/automations" data-view="automations">Automations</a>
      <a href="#/sources" data-view="sources">Sources</a>
    </nav>
  </header>

  <main id="main" class="main"></main>

  <div class="modal-root" id="modal-root" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="crm.js"></script>
</body>
</html>
